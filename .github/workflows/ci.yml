name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from "packageManager" in package.json (pnpm@9.15.0)
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # the toolchain pinned in contracts/*/rust-toolchain.toml
      - name: Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --target wasm32-unknown-unknown --component rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            contracts/board
            contracts/rings
            contracts/mandate
      - run: pnpm install --frozen-lockfile
      # TS unit/property tests for every package and app, then the three contracts' Rust tests
      - run: make test
