[package]
name = "nomad-board"
version = "0.1.0"
edition = "2021"
description = "Nomad offer board: public record of agent offers and advisory ring log"
license = "MIT"
repository = "https://github.com/charlesms1246/nomad"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.30.2", features = ["legacy"] }
serde_json = "1"

[dev-dependencies]
near-sdk = { version = "5.30.2", features = ["legacy", "unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(near)'] }
