[package]
name = "nomad-mandate"
version = "0.1.0"
edition = "2021"
description = "Nomad agent mandate: signs ERC-191 intents legs via NEAR chain signatures, only inside the owner's rules"
license = "MIT"
repository = "https://github.com/charlesms1246/nomad"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.30.2", features = ["unstable"] }
serde_json = "1"
bs58 = { version = "0.5", default-features = false, features = ["alloc"] }

[dev-dependencies]
near-sdk = { version = "5.30.2", features = ["unstable", "unit-testing"] }
k256 = { version = "0.13", features = ["ecdsa"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(near)'] }
