[package]
name = "nomad-rings"
version = "0.1.0"
edition = "2021"
description = "Nomad v2: permissionless on-chain ring closing for NEAR Intents (any wallet standard), closer tips, ERC-8004-style reputation"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.30.2", features = ["legacy"] }
serde_json = "1"

[dev-dependencies]
near-sdk = { version = "5.30.2", features = ["legacy", "unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(near)'] }
